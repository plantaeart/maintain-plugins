name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # OMPCODE is set per leg so the suite is exercised in both ambient
        # environments, the way a real pi and a real omp session differ. It is
        # NOT a host signal this code trusts: src/core/paths.ts documents that
        # pi sets OMPCODE=1 too, and detectHost() reads argv instead.
        #
        # Both hosts are genuinely covered because tests/e2e/sandbox.test.ts
        # spawns the real `pi` and `omp` binaries - each leg runs the same two.
        # Host-specific behaviour is pinned by argv fixtures in
        # tests/unit/host-detection.test.ts, which do not read the environment.
        include:
          - host: pi
            ompcode: '0'
          - host: omp
            ompcode: '1'
    name: test (${{ matrix.host }})
    env:
      OMPCODE: ${{ matrix.ompcode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same dev shell contributors get from direnv: bun, node, and the pinned
      # Pi/OMP CLIs (flake.nix is the single source of the pins). The e2e suite
      # spawns the real hosts, so the run exercises the genuine code path
      # instead of a faked one.
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # The e2e suite skips a host missing from PATH, so a failed CLI install
      # in the shell hook would otherwise pass CI with nothing tested.
      - name: Verify Pi and OMP CLIs
        run: nix develop -c bash -c 'pi --version && omp --version'

      - name: Install dependencies
        run: nix develop -c bun install --frozen-lockfile

      - name: Lint
        run: nix develop -c bun run lint

      - name: Type-check
        run: nix develop -c bun run typecheck

      - name: Test
        run: nix develop -c bun test

  lint-skills:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # Same script `bun run validate:skills` runs locally, so CI and a
      # contributor can never validate against different rules. skills-ref is
      # not in nixpkgs, so it is installed with uv (pinned by commit) inside the shell.
      - name: Validate skills
        run: |
          nix develop -c bash -c '
            uv tool install git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref
            PATH="$(uv tool dir --bin):$PATH" bash .agents/skills/ci-check/scripts/validate-skills.sh
          '
